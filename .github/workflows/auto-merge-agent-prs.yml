name: Auto-merge Agent PRs

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.event.check_suite.pull_requests[0].number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  mark-ready:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == true &&
      (
        github.event.pull_request.user.login == 'claude[bot]' ||
        contains(github.event.pull_request.head.ref, 'claude/')
      )
    steps:
      - name: Mark PR as ready for review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              draft: false
            });

  auto-approve:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.merged != true &&
      github.event.pull_request.draft == false &&
      (
        github.event.pull_request.user.login == 'claude[bot]' ||
        contains(github.event.pull_request.head.ref, 'claude/')
      )
    steps:
      - name: Wait for checks to complete
        id: wait-checks
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const maxWait = 10 * 60 * 1000;
            const pollInterval = 30 * 1000;
            const startTime = Date.now();

            while (Date.now() - startTime < maxWait) {
              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha
              });

              const relevantChecks = checks.check_runs.filter(
                (checkRun) => !checkRun.name.includes('Auto-merge')
              );

              const pending = relevantChecks.filter((checkRun) => checkRun.status !== 'completed');
              const failed = relevantChecks.filter(
                (checkRun) => checkRun.status === 'completed' && checkRun.conclusion === 'failure'
              );

              if (pending.length === 0) {
                return { checksPass: failed.length === 0 };
              }

              await new Promise((resolve) => setTimeout(resolve, pollInterval));
            }

            return { checksPass: false };

      - name: Approve PR
        if: fromJSON(steps.wait-checks.outputs.result).checksPass == true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              event: 'APPROVE',
              body: 'Auto-approved after all checks passed for a Claude-generated PR.'
            });

  auto-merge:
    runs-on: ubuntu-latest
    needs: auto-approve
    if: always() && needs.auto-approve.result == 'success'
    steps:
      - name: Merge PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash'
              });
            } catch (error) {
              console.log(`Merge skipped: ${error.message}`);
            }
